account-blocklist:
  - "999999999999"

resource-types:
  excludes:
  - IAMUserPolicyAttachment
  - IAMLoginProfile

accounts:
  "689060328920":
    filters:
      IAMUser:
        - "nuke"
        - "sysop"
      IAMUserPolicyAttachment:
        - type: "glob"
          value: "nuke -> *"
        - type: "glob"
          value: "sysop -> *"
      IAMUserAccessKey:
        - type: "glob"
          value: "nuke -> *"
        - type: "glob"
          value: "sysop -> *"